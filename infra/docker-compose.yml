name: infra-coffe-shop

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coffe
      POSTGRES_PASSWORD: coffe
      POSTGRES_DB: coffe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf

volumes:
  pgdata:
  minio-data: