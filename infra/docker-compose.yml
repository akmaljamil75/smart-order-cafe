name: infra-coffe-shop

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coffe
      POSTGRES_PASSWORD: coffe
      POSTGRES_DB: coffe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:latest
    container_name: redis-coffe
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      # Admin credentials for the Keycloak master realm
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Database backend
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/coffe
      KC_DB_USERNAME: coffe
      KC_DB_PASSWORD: coffe
      # Hostname configuration (dev mode — no HTTPS required)
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

volumes:
  pgdata:
  redis_data: